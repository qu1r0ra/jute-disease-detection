name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WANDB_MODE: disabled
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  smoke:
    runs-on: ubuntu-latest
    env:
      WANDB_MODE: disabled

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build synthetic dataset and split
        run: |
          uv run python scripts/make_synthetic_data.py
          uv run python src/jute_disease/data/utils.py split

      - name: Train one batch (fast_dev_run)
        run: >
          uv run python scripts/train_dl.py fit
          --config configs/baselines/mobilenet_v2.yaml
          --trainer.fast_dev_run=True
          --trainer.logger=null
          --trainer.accelerator=cpu
          --model.compile_model=false
          --data.num_workers=0
